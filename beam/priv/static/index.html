<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mitos Runtime</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <style>
    :root {
      --bg: #11100f;
      --surface: #181716;
      --surface-2: #201e1b;
      --line: #34302a;
      --line-soft: #26231f;
      --text: #ece7dd;
      --muted: #aba296;
      --dim: #7c7368;
      --green: #65b891;
      --green-bg: #163327;
      --amber: #d7a64a;
      --amber-bg: #3a2b12;
      --red: #df6b63;
      --red-bg: #3a1917;
      --cyan: #6db6c8;
      --violet: #b28bd8;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px var(--sans);
    }

    body { overflow: hidden; }

    button, input, textarea, select {
      font: inherit;
      color: var(--text);
    }

    button {
      border: 1px solid var(--line);
      background: var(--surface-2);
      min-height: 34px;
      padding: 0 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { border-color: #5b5146; }
    button:disabled { cursor: not-allowed; color: var(--dim); opacity: 0.7; }

    .primary {
      border-color: #6a5130;
      background: #2f2415;
      color: #ffe2aa;
      font-weight: 650;
    }

    .danger {
      border-color: #6b302d;
      background: var(--red-bg);
      color: #ffc6c1;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #0d0c0b;
      border-radius: 6px;
      padding: 8px 9px;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 2px rgba(215, 166, 74, 0.16);
    }

    textarea {
      min-height: 118px;
      resize: vertical;
      line-height: 1.4;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr);
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: #151311;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mark {
      width: 22px;
      height: 22px;
      border: 1px solid #6a5130;
      border-radius: 5px;
      display: grid;
      place-items: center;
      color: var(--amber);
      font: 800 13px var(--mono);
      background: #21170d;
    }

    .brand strong {
      font-size: 14px;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .run-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
    }

    .chip {
      min-width: 0;
      max-width: 240px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      padding: 4px 9px;
      color: var(--muted);
      background: #0f0e0d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font: 12px var(--mono);
    }

    .chip.good { color: #b8f1d2; background: var(--green-bg); border-color: #2f6c50; }
    .chip.warn { color: #ffdf9e; background: var(--amber-bg); border-color: #73551d; }
    .chip.bad { color: #ffc6c1; background: var(--red-bg); border-color: #743430; }

    .shell {
      display: grid;
      grid-template-columns: 360px minmax(420px, 1fr) 360px;
      min-height: 0;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--line);
      background: var(--surface);
    }

    .pane:last-child { border-right: 0; border-left: 1px solid var(--line); }

    .left, .right {
      overflow: auto;
      padding: 14px;
    }

    .center {
      display: grid;
      grid-template-rows: 36px minmax(0, 1fr);
      background: #0b0a09;
    }

    .section {
      display: grid;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line-soft);
    }

    .section:last-child {
      border-bottom: 0;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .section h2 {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #cdbf9e;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0d0c0b;
    }

    .segmented button {
      border: 0;
      min-height: 32px;
      background: transparent;
      color: var(--muted);
    }

    .segmented button.active {
      background: var(--surface-2);
      color: var(--text);
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .checks {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #0d0c0b;
      font-weight: 600;
    }

    .check input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--amber);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sample {
      min-height: 30px;
      padding: 0 10px;
      color: #d7cbbd;
      background: #12100e;
    }

    .hidden { display: none !important; }

    .terminal-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      background: #11100f;
      min-width: 0;
    }

    .terminal-title {
      color: var(--muted);
      font: 12px var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .terminal-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-button {
      width: 30px;
      min-height: 28px;
      padding: 0;
      display: grid;
      place-items: center;
      font: 700 13px var(--mono);
    }

    #terminal {
      min-height: 0;
      padding: 6px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 9px;
      background: #12100e;
      min-width: 0;
    }

    .metric .k {
      color: var(--dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    .metric .v {
      color: var(--text);
      font: 13px var(--mono);
      overflow-wrap: anywhere;
    }

    .event-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .event {
      border: 1px solid var(--line-soft);
      border-left-width: 3px;
      border-radius: 8px;
      padding: 9px;
      background: #12100e;
      min-width: 0;
    }

    .event.run { border-left-color: var(--green); }
    .event.output { border-left-color: var(--cyan); }
    .event.action { border-left-color: var(--amber); background: #17120a; }
    .event.error { border-left-color: var(--red); background: #18100f; }
    .event.raw { border-left-color: var(--violet); }

    .event-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .event-type {
      font: 700 12px var(--mono);
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-time {
      margin-left: auto;
      color: var(--dim);
      font: 11px var(--mono);
      white-space: nowrap;
    }

    .event-detail {
      margin-top: 6px;
      color: var(--muted);
      line-height: 1.35;
      overflow-wrap: anywhere;
      font: 12px var(--mono);
    }

    .event-actions {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 16px;
      color: var(--dim);
      text-align: center;
    }

    .json-small {
      min-height: 72px;
      font: 12px var(--mono);
    }

    @media (max-width: 1180px) {
      body { overflow: auto; }
      .app { min-height: 100vh; height: auto; }
      .shell {
        grid-template-columns: 340px minmax(0, 1fr);
        grid-template-rows: minmax(520px, 70vh) auto;
      }
      .right {
        grid-column: 1 / -1;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }

    @media (max-width: 760px) {
      .topbar {
        grid-template-columns: 1fr;
        height: auto;
        padding: 10px;
      }
      .run-summary { flex-wrap: wrap; }
      .shell {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(420px, 65vh) auto;
      }
      .pane, .pane:last-child {
        border-right: 0;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .left { border-top: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">M</div>
        <strong>Mitos Runtime</strong>
      </div>
      <div class="run-summary">
        <span id="status-chip" class="chip">idle</span>
        <span id="session-chip" class="chip">no session</span>
        <span id="transport-chip" class="chip">transport: none</span>
        <span id="trace-chip" class="chip">trace: none</span>
      </div>
      <div class="actions">
        <button id="snapshot-button" title="Request snapshot" disabled>Snap</button>
        <button id="signal-button" class="danger" title="Send SIGTERM" disabled>Stop</button>
      </div>
    </header>

    <main class="shell">
      <aside class="pane left">
        <section class="section">
          <h2>Launch</h2>
          <div class="segmented" role="tablist" aria-label="Launch mode">
            <button id="mode-agent" class="active" data-mode="agent" type="button">Agent</button>
            <button id="mode-shell" data-mode="shell" type="button">Shell</button>
          </div>
        </section>

        <section id="agent-panel" class="section">
          <h2>Agent Run</h2>
          <div class="grid-2">
            <label>
              Provider
              <select id="provider">
                <option value="fake">fake</option>
                <option value="codex">codex</option>
                <option value="claude">claude</option>
                <option value="gemini">gemini</option>
              </select>
            </label>
            <label>
              CWD
              <input id="agent-cwd" value="." />
            </label>
          </div>
          <label>
            Task
            <textarea id="task">hello</textarea>
          </label>
          <label>
            Transport Order
            <div class="checks">
              <span class="check"><input id="transport-stdio" type="checkbox" checked />stdio-json</span>
              <span class="check"><input id="transport-pty" type="checkbox" checked />pty</span>
            </div>
          </label>
          <label>
            Env JSON
            <textarea id="agent-env" class="json-small" spellcheck="false">{}</textarea>
          </label>
          <div class="actions">
            <button id="start-agent" class="primary" type="button">Start Agent</button>
            <button class="sample" data-sample="fake-final" type="button">Fake Final</button>
            <button class="sample" data-sample="fake-approval" type="button">Approval</button>
          </div>
        </section>

        <section id="shell-panel" class="section hidden">
          <h2>Raw Session</h2>
          <label>
            ARGV JSON
            <textarea id="argv" class="json-small" spellcheck="false">["/bin/sh","-i"]</textarea>
          </label>
          <label>
            CWD
            <input id="shell-cwd" value="." />
          </label>
          <label>
            Env JSON
            <textarea id="shell-env" class="json-small" spellcheck="false">{}</textarea>
          </label>
          <div class="actions">
            <button id="start-shell" class="primary" type="button">Start Shell</button>
            <button class="sample" data-sample="shell" type="button">/bin/sh</button>
          </div>
        </section>
      </aside>

      <section class="pane center">
        <div class="terminal-head">
          <span id="terminal-title" class="terminal-title">terminal</span>
          <div class="terminal-actions">
            <button id="clear-button" class="icon-button" title="Clear terminal" type="button">C</button>
            <button id="fit-button" class="icon-button" title="Fit terminal" type="button">F</button>
          </div>
        </div>
        <div id="terminal"></div>
      </section>

      <aside class="pane right">
        <section class="section">
          <h2>Run State</h2>
          <div class="metric-grid">
            <div class="metric"><div class="k">Session</div><div id="metric-session" class="v">none</div></div>
            <div class="metric"><div class="k">Mode</div><div id="metric-mode" class="v">agent</div></div>
            <div class="metric"><div class="k">Provider</div><div id="metric-provider" class="v">fake</div></div>
            <div class="metric"><div class="k">Events</div><div id="metric-events" class="v">0</div></div>
            <div class="metric"><div class="k">Raw Refs</div><div id="metric-rawrefs" class="v">0</div></div>
            <div class="metric"><div class="k">Actions</div><div id="metric-actions" class="v">0</div></div>
          </div>
        </section>

        <section class="section">
          <h2>Event Stream</h2>
          <ol id="events" class="event-list">
            <li class="empty">No events</li>
          </ol>
        </section>
      </aside>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script>
    const els = {
      statusChip: document.getElementById("status-chip"),
      sessionChip: document.getElementById("session-chip"),
      transportChip: document.getElementById("transport-chip"),
      traceChip: document.getElementById("trace-chip"),
      terminalTitle: document.getElementById("terminal-title"),
      modeAgent: document.getElementById("mode-agent"),
      modeShell: document.getElementById("mode-shell"),
      agentPanel: document.getElementById("agent-panel"),
      shellPanel: document.getElementById("shell-panel"),
      provider: document.getElementById("provider"),
      task: document.getElementById("task"),
      agentCwd: document.getElementById("agent-cwd"),
      agentEnv: document.getElementById("agent-env"),
      transportStdio: document.getElementById("transport-stdio"),
      transportPty: document.getElementById("transport-pty"),
      argv: document.getElementById("argv"),
      shellCwd: document.getElementById("shell-cwd"),
      shellEnv: document.getElementById("shell-env"),
      startAgent: document.getElementById("start-agent"),
      startShell: document.getElementById("start-shell"),
      snapshotButton: document.getElementById("snapshot-button"),
      signalButton: document.getElementById("signal-button"),
      clearButton: document.getElementById("clear-button"),
      fitButton: document.getElementById("fit-button"),
      events: document.getElementById("events"),
      metricSession: document.getElementById("metric-session"),
      metricMode: document.getElementById("metric-mode"),
      metricProvider: document.getElementById("metric-provider"),
      metricEvents: document.getElementById("metric-events"),
      metricRawRefs: document.getElementById("metric-rawrefs"),
      metricActions: document.getElementById("metric-actions"),
    };

    const state = {
      mode: "agent",
      socket: null,
      sessionId: null,
      provider: "fake",
      eventCount: 0,
      rawRefs: 0,
      actions: 0,
      lastTransport: "none",
    };

    const term = new Terminal({
      cursorBlink: true,
      fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
      fontSize: 13,
      theme: {
        background: "#0b0a09",
        foreground: "#ece7dd",
        cursor: "#d7a64a",
        selectionBackground: "#3a2b12",
      },
      allowProposedApi: true,
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("terminal"));
    fit.fit();

    function setStatus(text, kind) {
      els.statusChip.textContent = text;
      els.statusChip.className = "chip" + (kind ? " " + kind : "");
    }

    function setMode(mode) {
      state.mode = mode;
      els.modeAgent.classList.toggle("active", mode === "agent");
      els.modeShell.classList.toggle("active", mode === "shell");
      els.agentPanel.classList.toggle("hidden", mode !== "agent");
      els.shellPanel.classList.toggle("hidden", mode !== "shell");
      els.metricMode.textContent = mode;
    }

    function parseJsonInput(el, fallback) {
      const text = el.value.trim();
      if (!text) return fallback;
      return JSON.parse(text);
    }

    function transportOrder() {
      const order = [];
      if (els.transportStdio.checked) order.push("stdio-json");
      if (els.transportPty.checked) order.push("pty");
      return order.length ? order : ["stdio-json", "pty"];
    }

    function setBusy(isBusy) {
      els.startAgent.disabled = isBusy;
      els.startShell.disabled = isBusy;
      if (isBusy) setStatus("starting", "warn");
    }

    async function startAgent() {
      setBusy(true);
      try {
        const order = transportOrder();
        const provider = els.provider.value;
        const body = {
          provider,
          task: els.task.value,
          cwd: els.agentCwd.value || ".",
          env: parseJsonInput(els.agentEnv, {}),
          transport_order: order,
          cols: term.cols,
          rows: term.rows,
        };
        const run = await postJson("/agents", body);
        state.provider = provider;
        state.lastTransport = order.join(" -> ");
        connect(run.session_id, { mode: "agent", provider, transport: state.lastTransport });
      } catch (error) {
        setStatus(error.message, "bad");
      } finally {
        setBusy(false);
      }
    }

    async function startShell() {
      setBusy(true);
      try {
        const argv = parseJsonInput(els.argv, []);
        if (!Array.isArray(argv) || argv.length === 0) throw new Error("argv must be a JSON array");
        const body = {
          argv,
          cwd: els.shellCwd.value || ".",
          env: parseJsonInput(els.shellEnv, {}),
          cols: term.cols,
          rows: term.rows,
        };
        const run = await postJson("/sessions", body);
        state.provider = "raw";
        state.lastTransport = "pty";
        connect(run.session_id, { mode: "shell", provider: "raw", transport: "pty" });
      } catch (error) {
        setStatus(error.message, "bad");
      } finally {
        setBusy(false);
      }
    }

    async function postJson(path, body) {
      const resp = await fetch(path, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      const text = await resp.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch (_) {}
      if (!resp.ok) throw new Error(data.error || "request failed: " + resp.status);
      return data;
    }

    function connect(sessionId, meta) {
      if (state.socket) {
        try { state.socket.close(); } catch (_) {}
        state.socket = null;
      }

      state.sessionId = sessionId;
      state.eventCount = 0;
      state.rawRefs = 0;
      state.actions = 0;
      clearEvents();
      term.clear();
      updateSummary(meta);

      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${proto}//${location.host}/ws/${encodeURIComponent(sessionId)}`);
      socket.binaryType = "arraybuffer";
      state.socket = socket;

      socket.onopen = () => {
        setStatus("connected", "good");
        els.snapshotButton.disabled = false;
        els.signalButton.disabled = false;
        socket.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
      };
      socket.onmessage = handleSocketMessage;
      socket.onclose = () => {
        setStatus("disconnected", "bad");
        els.snapshotButton.disabled = true;
        els.signalButton.disabled = true;
      };
      socket.onerror = () => setStatus("socket error", "bad");
    }

    function updateSummary(meta) {
      els.sessionChip.textContent = state.sessionId || "no session";
      els.traceChip.textContent = state.sessionId ? `.runs/${state.sessionId}` : "trace: none";
      els.transportChip.textContent = "transport: " + (meta && meta.transport ? meta.transport : state.lastTransport);
      els.terminalTitle.textContent = state.sessionId ? `${state.sessionId} / ${meta.mode}` : "terminal";
      els.metricSession.textContent = state.sessionId || "none";
      els.metricMode.textContent = meta.mode;
      els.metricProvider.textContent = meta.provider;
      updateMetrics();
    }

    function handleSocketMessage(ev) {
      if (typeof ev.data === "string") {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (_) { return; }
        if (msg.type === "event") {
          handleEvent(msg.event || {});
        } else if (msg.type === "snapshot") {
          handleSnapshot(msg.snapshot || {});
        }
      } else {
        term.write(new Uint8Array(ev.data));
      }
    }

    function handleEvent(event) {
      state.eventCount += 1;
      if (event.type === "RAW_REF") state.rawRefs += 1;
      if (event.type === "ACTION_REQUESTED") state.actions += 1;
      if (event.transport) {
        state.lastTransport = event.transport;
        els.transportChip.textContent = "transport: " + event.transport;
      }
      if (event.type === "exit" || event.type === "sidecar_exit" || event.type === "PROCESS_EXITED") {
        setStatus("exited", event.code === 0 ? "good" : "warn");
      }
      if (event.type === "ERROR") setStatus("error", "bad");
      addEvent(event);
      updateMetrics();
    }

    function handleSnapshot(snapshot) {
      addEvent({
        type: "SNAPSHOT",
        seq: snapshot.seq,
        cols: snapshot.cols,
        rows: snapshot.rows,
      });
    }

    function addEvent(event) {
      if (els.events.querySelector(".empty")) els.events.textContent = "";

      const item = document.createElement("li");
      item.className = "event " + eventClass(event);

      const top = document.createElement("div");
      top.className = "event-top";
      const type = document.createElement("div");
      type.className = "event-type";
      type.textContent = event.type || "EVENT";
      const time = document.createElement("div");
      time.className = "event-time";
      time.textContent = new Date().toLocaleTimeString();
      top.append(type, time);

      const detail = document.createElement("div");
      detail.className = "event-detail";
      detail.textContent = eventDetail(event);

      item.append(top, detail);

      if (event.type === "ACTION_REQUESTED" && event.action_id) {
        const row = document.createElement("div");
        row.className = "event-actions";
        const allow = document.createElement("button");
        allow.type = "button";
        allow.textContent = "Allow";
        allow.className = "primary";
        allow.addEventListener("click", () => sendAuthorize(event.action_id, allow, deny));
        const deny = document.createElement("button");
        deny.type = "button";
        deny.textContent = "Deny";
        deny.className = "danger";
        deny.addEventListener("click", () => sendDeny(event.action_id, allow, deny));
        row.append(allow, deny);
        item.append(row);
      }

      els.events.prepend(item);
      while (els.events.children.length > 90) els.events.lastElementChild.remove();
    }

    function eventClass(event) {
      const type = event.type || "";
      if (type === "ERROR") return "error";
      if (type === "ACTION_REQUESTED" || type === "PROMPT_DETECTED") return "action";
      if (type === "RAW_REF") return "raw";
      if (type === "STRUCTURED_OUTPUT" || type === "FINAL_OUTPUT" || type === "SNAPSHOT" || type === "TERMINAL_OUTPUT") return "output";
      return "run";
    }

    function eventDetail(event) {
      switch (event.type) {
        case "RUN_STARTED":
          return `${event.provider || "provider"} / ${event.transport || "transport"} / ${event.codec || "codec"}`;
        case "PROCESS_SPAWNED":
          return `pid=${event.pid || "n/a"} cwd=${event.cwd || "."}`;
        case "PROCESS_EXITED":
        case "exit":
          return event.code !== undefined ? `code=${event.code}` : `signal=${event.signal || "n/a"}`;
        case "RAW_REF":
          return `offset=${event.offset} len=${event.len} ${event.path || ""}`;
        case "PROMPT_DETECTED":
          return `${event.prompt_kind || "prompt"} ${event.text || ""}`.trim();
        case "ACTION_REQUESTED":
          return `${event.action || "action"} ${event.context || ""}`.trim();
        case "STRUCTURED_OUTPUT":
          return `${event.kind || event.stream || "structured"} ${compactJson(event.bytes || event.text || "")}`;
        case "FINAL_OUTPUT":
          return event.text || "";
        case "TERMINAL_OUTPUT":
          return event.text || "";
        case "SNAPSHOT":
          return `seq=${event.seq || 0} ${event.cols || "?"}x${event.rows || "?"}`;
        case "ERROR":
          return `${event.kind || "error"} ${event.detail || ""}`.trim();
        default:
          return compactJson(event);
      }
    }

    function compactJson(value) {
      if (value === undefined || value === null) return "";
      if (typeof value === "string") return value.length > 180 ? value.slice(0, 180) + "..." : value;
      try {
        const text = JSON.stringify(value);
        return text.length > 180 ? text.slice(0, 180) + "..." : text;
      } catch (_) {
        return String(value);
      }
    }

    function clearEvents() {
      els.events.innerHTML = '<li class="empty">No events</li>';
      updateMetrics();
    }

    function updateMetrics() {
      els.metricEvents.textContent = String(state.eventCount);
      els.metricRawRefs.textContent = String(state.rawRefs);
      els.metricActions.textContent = String(state.actions);
    }

    function socketSend(payload) {
      if (!state.socket || state.socket.readyState !== 1) return false;
      state.socket.send(JSON.stringify(payload));
      return true;
    }

    function sendAuthorize(actionId, allowButton, denyButton) {
      socketSend({ type: "authorize", action_id: actionId, token: "ui-" + Date.now() });
      allowButton.disabled = true;
      denyButton.disabled = true;
    }

    function sendDeny(actionId, allowButton, denyButton) {
      socketSend({ type: "deny", action_id: actionId, reason: "denied from ui" });
      allowButton.disabled = true;
      denyButton.disabled = true;
    }

    term.onData((data) => {
      if (!state.socket || state.socket.readyState !== 1) return;
      state.socket.send(new TextEncoder().encode(data));
    });

    function refit() {
      fit.fit();
      socketSend({ type: "resize", cols: term.cols, rows: term.rows });
    }

    window.addEventListener("resize", refit);
    els.fitButton.addEventListener("click", refit);
    els.clearButton.addEventListener("click", () => term.clear());
    els.snapshotButton.addEventListener("click", () => socketSend({ type: "snapshot" }));
    els.signalButton.addEventListener("click", () => socketSend({ type: "signal", signum: 15 }));
    els.modeAgent.addEventListener("click", () => setMode("agent"));
    els.modeShell.addEventListener("click", () => setMode("shell"));
    els.startAgent.addEventListener("click", startAgent);
    els.startShell.addEventListener("click", startShell);
    els.provider.addEventListener("change", () => {
      els.metricProvider.textContent = els.provider.value;
      const isGemini = els.provider.value === "gemini";
      els.transportPty.checked = !isGemini;
    });

    document.querySelectorAll("[data-sample]").forEach((button) => {
      button.addEventListener("click", () => {
        const sample = button.dataset.sample;
        if (sample === "fake-final") {
          setMode("agent");
          els.provider.value = "fake";
          els.task.value = "hello";
          els.transportStdio.checked = true;
          els.transportPty.checked = true;
        } else if (sample === "fake-approval") {
          setMode("agent");
          els.provider.value = "fake";
          els.task.value = "FAKE_APPROVAL: Run tests? [y/N]";
          els.transportStdio.checked = true;
          els.transportPty.checked = false;
        } else if (sample === "shell") {
          setMode("shell");
          els.argv.value = '["/bin/sh","-i"]';
        }
      });
    });

    setStatus("idle", "");
    updateMetrics();
  </script>
</body>
</html>
